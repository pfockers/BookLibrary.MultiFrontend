name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore BookLibrary.MultiFrontend.slnx
      - run: dotnet build BookLibrary.MultiFrontend.slnx --no-restore --configuration Release
      - run: dotnet test BookLibrary.MultiFrontend.slnx --no-build --configuration Release

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BookLibrary.React
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/BookLibrary.React/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
