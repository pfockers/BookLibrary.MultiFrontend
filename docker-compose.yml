services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booklibrary
      POSTGRES_USER: booklibrary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklibrary -d booklibrary"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/BookLibrary.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Books: Host=postgres;Port=5432;Database=booklibrary;Username=booklibrary;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      Auth0__Domain: ${AUTH0_DOMAIN:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5211:8080"

  react:
    build:
      context: src/BookLibrary.React
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

  blazor:
    build:
      context: src/BookLibrary.Blazor
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5044:80"
    depends_on:
      - api

volumes:
  postgres-data:
